<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Revue</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ── Sticky top bar (header + prompt bar + patch tabs) ── -->
  <div id="top-bar">

    <!-- ── Worktree switcher (shown when multiple worktrees exist) ── -->
    <!-- Results on the left (pills, best match first), search on the right;
         matches that don't fit are behind "+N". -->
    <div id="worktree-bar" style="display:none;">
      <div id="worktree-pills" role="listbox" aria-label="Worktrees"></div>
      <button id="worktree-more" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="worktree-more-list" hidden></button>
      <div id="worktree-search-wrap">
        <input id="worktree-search" type="text" role="combobox" autocomplete="off" spellcheck="false"
          placeholder="Filter worktrees…" aria-label="Filter worktrees" aria-autocomplete="list"
          aria-expanded="true" aria-controls="worktree-pills worktree-more-list">
        <kbd class="worktree-search-hint" aria-hidden="true">/</kbd>
        <div id="worktree-more-list" role="listbox" aria-label="More worktrees" hidden></div>
      </div>
      <div id="worktree-search-status" class="visually-hidden" aria-live="polite"></div>
    </div>

    <!-- ── Update notification banner (shown when worktree HEAD changes) ── -->
    <div id="update-banner" style="display:none;">
      <span>Codebase updated — patches may have changed.</span>
      <button id="btn-reload-page">Reload</button>
    </div>

    <!-- ── Header ── -->
    <div id="header">
      <div id="header-left">
        <h1><a href="https://github.com/alastor0325/revue" target="_blank" class="app-name">Revue</a><select id="project-switcher" aria-label="Switch project" hidden></select><span id="bug-id-display"></span></h1>
        <div id="worktree-path"></div>
      </div>
      <div id="submit-area">
        <button id="btn-submit" disabled>Generate Review Prompt</button>
        <span id="submit-warning">Add at least one comment first</span>
        <span id="autosave-status"></span>
      </div>
    </div>

    <!-- ── Current prompt bar (shown when MD file already exists) ── -->
    <div id="current-prompt-bar" style="display:none;">
      <span id="current-prompt-label">Review prompt ready</span>
      <button id="btn-copy-current-prompt">Copy current prompt</button>
    </div>

    <!-- ── Patch tabs (shown only when there are multiple patches) ── -->
    <div id="patch-tabs-bar" style="display:none;">
      <div id="patch-tabs"></div>
    </div>

  </div>

  <!-- ── Loading / error ── -->
  <div id="loading">Loading diff…</div>
  <div id="error-msg" style="display:none;"></div>
  <div id="state-warning" style="display:none;"></div>

  <!-- ── Main layout: file nav sidebar + diff content ── -->
  <div id="main-layout">
    <nav id="file-nav" style="display:none;"></nav>
    <div id="files-changed" style="display:none;"></div>
  </div>

  <!-- ── Result overlay ── -->
  <div id="result-overlay">
    <div id="result-modal">
      <h3>Review saved!</h3>
      <p>Saved to: <code id="result-feedback-path"></code></p>
      <textarea id="result-prompt" readonly></textarea>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button id="btn-copy-prompt">Copy prompt</button>
        <button id="btn-close-modal">Close</button>
      </div>
    </div>
  </div>

  <!-- ── Back to top ── -->
  <button id="btn-back-to-top" title="Back to top" aria-label="Back to top">↑ Top</button>

  <script type="module" src="app.js"></script>
</body>
</html>
